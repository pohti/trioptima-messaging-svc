events {
    worker_connections 1024;
}

http {
    # Write API upstream (message creation)
    upstream write_api {
        server messaging-api:8000;
    }
    
    # Read API upstream (message reading/deletion)
    upstream read_api {
        server messaging-reader:8001;
    }
    
    # Write API server block
    server {
        listen 80;
        server_name localhost;
        
        location / {
            proxy_pass http://write_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Read API server block
    server {
        listen 81;
        server_name localhost;
        
        location / {
            proxy_pass http://read_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
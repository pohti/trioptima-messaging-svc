  # API Gateway Service (FastAPI routing)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: messaging-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      # - DATABASE_URL=postgresql://messaging_user:messaging_pass@database:5432/messaging
      - DATABASE_URL=sqlite:///./messages.db
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    volumes:
      - ./src/api:/app/src/api
    # depends_on:

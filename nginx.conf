events {
    worker_connections 1024;
}

http {
    upstream messaging_router {
        server messaging-router:8000;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        location / {
            proxy_pass http://messaging_router;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            
            # Enable caching
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;  # Fix typo: was "nosiff"
            
            # Enable directory browsing (optional)
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            try_files $uri $uri/ =404;  # Fix syntax: was "$uri = 404"
        }
     }
}
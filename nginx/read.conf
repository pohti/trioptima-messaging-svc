events {
    worker_connections 1024;
}

http {
    # Read service upstream with load balancing
    upstream read_backend {
        # Round-robin load balancing (default)
        server messaging-read:8002;
        # Docker will automatically distribute to replicas
    }
    
    server {
        listen 80;
        server_name localhost;
        
        # Health check endpoint
        location /health {
            return 200 "Read Load Balancer OK";
            add_header Content-Type text/plain;
        }
        
        # Proxy all requests to read backend
        location / {
            proxy_pass http://read_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Add load balancer info for debugging
            add_header X-Load-Balancer "read-lb";
        }
    }
}
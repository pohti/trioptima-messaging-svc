services:
  # Shared DB
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: messaging
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d messaging"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # server
      - "15672:15672"  # web UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  # API Router Service (Entry point)
  messaging-router:
    build:
      context: .
      dockerfile: Dockerfile.router
    environment:
      - PYTHONPATH=/app
      - READ_SERVICE_URL=http://messaging-read:8002
      - DELETE_SERVICE_URL=http://messaging-delete:8003
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    volumes:
      - ./src:/app/src
    depends_on:
      - messaging-write
      - messaging-read
      - messaging-delete
      - rabbitmq
    restart: unless-stopped

  # Reader Service (for reading and deleting messages)
  messaging-read:
    build:
      context: .
      dockerfile: Dockerfile.read
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Writer Service (for consuming message queue and writing to DB)
  messaging-write:
    build:
      context: .
      dockerfile: Dockerfile.write
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 2

  # Delete Service
  messaging-delete:
    build:
      context: .
      dockerfile: Dockerfile.delete
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # nginx as round-robin load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"  # host:nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - messaging-router
      - messaging-read
      - messaging-write
      - messaging-delete
    restart: unless-stopped

volumes:
  postgres_data:
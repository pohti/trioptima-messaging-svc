services:
  # Shared DB
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: messaging
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d messaging"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Message Queue
  rabbitmq:
    image: rabbitmq:3
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  # Reader Service
  messaging-read:
    build:
      context: .
      dockerfile: Dockerfile.read
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Writer Service
  messaging-write:
    build:
      context: .
      dockerfile: Dockerfile.write
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Delete Service
  messaging-delete:
    build:
      context: .
      dockerfile: Dockerfile.delete
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://db_user:db_password@database:5432/messaging
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Load Balancer for Read Service
  read-lb:
    image: nginx:alpine
    volumes:
      - ./nginx/read.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - messaging-read
    restart: unless-stopped
    # Internal port 80, no external exposure

  # Load Balancer for Delete Service  
  delete-lb:
    image: nginx:alpine
    volumes:
      - ./nginx/delete.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - messaging-delete
    restart: unless-stopped
    # Internal port 80, no external exposure

  # API Router Service
  messaging-router:
    build:
      context: .
      dockerfile: Dockerfile.router
    environment:
      - PYTHONPATH=/app
      - READ_SERVICE_URL=http://read-lb 
      - DELETE_SERVICE_URL=http://delete-lb
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
    depends_on:
      - messaging-write
      - read-lb
      - delete-lb
      - rabbitmq
      - redis
    restart: unless-stopped

  # nginx load balancer
  router-lb:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/router.conf:/etc/nginx/nginx.conf:ro # ro = read-only
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - messaging-router
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: